  <link rel="stylesheet" href="styles.css">
  <style>
    /* Animation d'ouverture : le logo se construit (boîtier, graduations, faisceau du radar qui tourne, arcs ambre,
       point central), puis « Plane GO ». Affichée une fois par lancement, retirée dès que le premier écran est prêt. */
    #splash { position: fixed; inset: 0; z-index: 9999; background: #0F1113; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; transition: opacity .35s ease; }
    #splash.out { opacity: 0; pointer-events: none; }
    #splash svg { width: 168px; height: auto; overflow: visible; }
    #splash .sp-body { animation: sp-in .45s cubic-bezier(.2,.8,.2,1) both; transform-origin: 256px 286px; }
    #splash .sp-ticks line { stroke: #4A4F56; stroke-width: 3; stroke-linecap: round; }
    #splash .sp-ticks { animation: sp-fade .35s .25s both; }
    #splash .sp-sweep { transform-origin: 256px 286px; animation: sp-turn 1.05s .3s cubic-bezier(.45,0,.3,1) both; }
    #splash .sp-arc { fill: none; stroke: #F2A93B; stroke-dasharray: 1; stroke-dashoffset: 1; }
    #splash .sp-a1 { stroke-width: 24; animation: sp-draw .7s .45s cubic-bezier(.3,0,.2,1) forwards; }
    #splash .sp-a2 { stroke-width: 16; animation: sp-draw .6s .65s cubic-bezier(.3,0,.2,1) forwards; }
    #splash .sp-dot { fill: #F2A93B; transform-origin: 256px 286px; animation: sp-pop .35s 1.05s cubic-bezier(.3,1.6,.5,1) both; }
    #splash .sp-ping { fill: none; stroke: #F2A93B; stroke-width: 3; transform-origin: 256px 286px; opacity: 0;
      animation: sp-ping .7s 1.2s ease-out forwards; }
    #splash .sp-name { font: 600 22px/1 "IBM Plex Sans", system-ui, sans-serif; color: #E9EAEC; letter-spacing: .01em;
      animation: sp-up .45s .95s cubic-bezier(.2,.8,.2,1) both; }
    #splash .sp-tag { font: 500 11px/1 "IBM Plex Mono", ui-monospace, monospace; color: #8A9098; letter-spacing: .22em;
      text-transform: uppercase; margin-top: -10px; animation: sp-up .45s 1.1s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes sp-in { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }
    @keyframes sp-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes sp-turn { 0% { opacity: 0; transform: rotate(-120deg); } 15% { opacity: 1; }
      85% { opacity: 1; } 100% { opacity: 0; transform: rotate(240deg); } }
    @keyframes sp-draw { to { stroke-dashoffset: 0; } }
    @keyframes sp-pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: none; } }
    @keyframes sp-ping { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(4.6); } }
    @keyframes sp-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      #splash *, #splash { animation: none !important; } #splash .sp-arc { stroke-dashoffset: 0; } #splash .sp-sweep { display: none; }
    }
  </style>
</head>
<body>
  <!-- Animation d'ouverture (style ci-dessus, retirée par le script en bas de page) -->
  <div id="splash" aria-hidden="true">
    <svg viewBox="80 110 352 300" xmlns="http://www.w3.org/2000/svg">
      <g class="sp-body">
        <path fill="#2E3237" d="M206 166 L222 130 Q226 122 235 122 H277 Q286 122 290 130 L306 166 Z"/>
        <rect fill="#2E3237" x="116" y="142" width="46" height="30" rx="7"/>
        <rect fill="#2E3237" x="88" y="160" width="336" height="242" rx="34"/>
        <rect fill="#0F1113" x="356" y="186" width="40" height="22" rx="6"/>
        <circle fill="#16181B" cx="256" cy="286" r="104"/>
      </g>
      <g class="sp-ticks"><line x1="352.0" y1="286.0" x2="357.0" y2="286.0"/><line x1="339.1" y1="334.0" x2="343.5" y2="336.5"/><line x1="304.0" y1="369.1" x2="306.5" y2="373.5"/><line x1="256.0" y1="382.0" x2="256.0" y2="387.0"/><line x1="208.0" y1="369.1" x2="205.5" y2="373.5"/><line x1="172.9" y1="334.0" x2="168.5" y2="336.5"/><line x1="160.0" y1="286.0" x2="155.0" y2="286.0"/><line x1="172.9" y1="238.0" x2="168.5" y2="235.5"/><line x1="208.0" y1="202.9" x2="205.5" y2="198.5"/><line x1="256.0" y1="190.0" x2="256.0" y2="185.0"/><line x1="304.0" y1="202.9" x2="306.5" y2="198.5"/><line x1="339.1" y1="238.0" x2="343.5" y2="235.5"/></g>
      <g class="sp-sweep"><path d="M256 286L185.5 226.9A92 92 0 0 1 256.0 194.0Z" fill="#F2A93B" opacity=".16"/><line x1="256" y1="286" x2="256" y2="194" stroke="#F2A93B" stroke-width="3" stroke-linecap="round" opacity=".85"/></g>
      <path class="sp-arc sp-a1" pathLength="1" d="M314.3 240.4A74 74 0 1 1 301.6 227.7"/>
      <path class="sp-arc sp-a2" pathLength="1" d="M292.1 262.6A43 43 0 1 1 279.4 249.9"/>
      <circle class="sp-ping" cx="256" cy="286" r="20"/>
      <circle class="sp-dot" cx="256" cy="286" r="20"/>
    </svg>
    <div class="sp-name">Plane GO</div>
    <div class="sp-tag" data-notr>Radar · Photo · Jeu</div>
  </div>
  <div id="app">
    <header class="hud" id="hud"></header>
    <main id="view"></main>
    <nav class="tabbar" id="tabs" aria-label="Onglets"></nav>
  </div>
  <noscript>
    <div style="padding:20px;max-width:720px;margin:auto;font-family:system-ui,sans-serif;color:#E9EAEC;background:#0F1113">
      <h1>Plane GO</h1>
      <p>Plane GO montre en temps réel les avions qui passent au-dessus de toi, te prévient quand l'un d'eux sera visible à l'œil nu,
      et transforme chaque passage en jeu : photographie-le pour l'ajouter à ta collection, apprends à reconnaître les modèles,
      défie tes amis. L'application a besoin de JavaScript pour fonctionner.</p>
      <p><a href="/guides/">Guides du spotter</a> · <a href="/a-propos/">À propos</a> · <a href="/contact/">Contact</a></p>
    </div>
  </noscript>
  <script>
    // Animation d'ouverture : une fois par lancement (pas à chaque rechargement), 1,5 s au moins pour la voir en entier,
    // retirée dès que app.js a affiché le premier écran (événement planego-ready), 4 s au plus.
    (function () {
      var s = document.getElementById("splash"); if (!s) return;
      try { if (sessionStorage.getItem("splash_seen")) { s.remove(); return; } sessionStorage.setItem("splash_seen", "1"); } catch (e) {}
      try { // même règle que i18n.js : réglage « Langue », sinon langue du téléphone
        var l = String(localStorage.getItem("lang") || "").replace(/"/g, "") || (/^fr/i.test(navigator.language || "fr") ? "fr" : "en");
        if (l === "en") s.querySelector(".sp-tag").textContent = "Radar · Photo · Game";
      } catch (e) {}
      var t0 = Date.now(), done = false, min = matchMedia("(prefers-reduced-motion: reduce)").matches ? 400 : 1550;
      function hide() {
        if (done) return; done = true;
        setTimeout(function () { s.classList.add("out"); setTimeout(function () { s.remove(); }, 400); }, Math.max(0, min - (Date.now() - t0)));
      }
      window.addEventListener("planego-ready", hide);
      setTimeout(hide, 4000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
