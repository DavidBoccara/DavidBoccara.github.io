<html lang="fr">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plane GO</title>
<meta name="theme-color" content="#0F1113">
<link rel="canonical" href="https://plane-go.com/">
<!-- Toute autre adresse (anciens liens) : vers plane-go.com ; l'ancien lien de l'appli Android garde son fichier -->
<script>
  var apk = /\/PlaneGO\.apk$/i.test(location.pathname);
  location.replace("https://plane-go.com/" + (apk ? "PlaneGO.apk" : "") + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="1; url=https://plane-go.com/">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0F1113; color: #E9EAEC;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  a { color: #F2A93B; }
</style>
</head>

  <main>
    <p>Plane GO est à l'adresse <a href="https://plane-go.com/">plane-go.com</a>.</p>
  </main>
